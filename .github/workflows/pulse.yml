name: Pulse

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6h (off the hour: scheduled runs at :00 are often delayed)
  workflow_dispatch:
    inputs:
      client:
        description: 'Only this client slug (empty = every active client)'
        required: false
        default: ''

# One writer at a time for the data repo.
concurrency:
  group: pulse-data-writer
  cancel-in-progress: false

permissions:
  contents: read   # this repo is only read; results go to the private data repo (deploy key / token)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write   # only for "Keep the schedule alive" below
    outputs:
      dashboard: ${{ steps.dash.outputs.built }}
    env:
      DATA_REPO: ${{ vars.DATA_REPO || 'Proofmaster/pulse-hub-data' }}
      # Access to the data repo: a deploy key (DATA_REPO_SSH_KEY, preferred) or a fine-grained token (DATA_REPO_TOKEN).
      HAS_DATA_SSH_KEY: ${{ secrets.DATA_REPO_SSH_KEY != '' }}
      HAS_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN != '' }}
      HAS_DASHBOARD: ${{ secrets.DASHBOARD_PASSPHRASE != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check setup
        run: |
          if [ "$HAS_DATA_SSH_KEY" != "true" ] && [ "$HAS_DATA_TOKEN" != "true" ]; then
            echo "::error::Add the secret DATA_REPO_SSH_KEY (deploy key) or DATA_REPO_TOKEN - see README.md, 'Setup'."
            exit 1
          fi

      - name: Check out the private data repo (deploy key)
        id: data_ssh
        if: env.HAS_DATA_SSH_KEY == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: data-repo

      - name: Check out the private data repo (token)
        id: data_token
        if: env.HAS_DATA_SSH_KEY != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run Pulse
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          F5BOT_MARK_SEEN: ${{ vars.F5BOT_MARK_SEEN || 'true' }}
          PYTHONUNBUFFERED: '1'   # log lines appear as they happen
          # All clients' Slack webhooks in ONE secret: {"<client-slug>": "https://hooks.slack.com/..."}.
          # (Only the secrets listed here reach the run; client names never appear in this public file.)
          SLACK_WEBHOOKS: ${{ secrets.SLACK_WEBHOOKS }}
          ONLY_CLIENT: ${{ inputs.client }}
        run: python run.py --clients-dir data-repo/clients --data-dir data-repo/data ${ONLY_CLIENT:+--client "$ONLY_CLIENT"}

      - name: Save results to the data repo
        # Save even when one client failed, so the others' results are kept.
        if: ${{ !cancelled() && (steps.data_ssh.outcome == 'success' || steps.data_token.outcome == 'success') }}
        working-directory: data-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Pulse run $(date -u +%Y-%m-%dT%H:%MZ)"
          # Runs are serialised and data files are fully derived, so on the rare conflict our fresh copy wins
          # ("theirs" = the commit being replayed during a rebase).
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push results after 5 attempts"
          exit 1

      - name: Build the dashboard (encrypted)
        id: dash
        if: ${{ !cancelled() && env.HAS_DASHBOARD == 'true' && (steps.data_ssh.outcome == 'success' || steps.data_token.outcome == 'success') }}
        env:
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
        run: |
          python tools/build_dashboard.py --clients-dir data-repo/clients --data-dir data-repo/data --out site
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Package the dashboard for GitHub Pages
        if: ${{ !cancelled() && steps.dash.outputs.built == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows in public repos after 60 days without commits, and results are
        # committed to the data repo, not here. Re-enabling the (already enabled) workflow resets that timer.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/pulse.yml/enable" && echo "Schedule kept alive."

  deploy-dashboard:
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.dashboard == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
