name: Search probe

# Manual diagnostic: which free search endpoints return results from GitHub's servers? Uses no secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt
      - run: python tools/probe_search.py
        env:
          PYTHONUNBUFFERED: '1'
